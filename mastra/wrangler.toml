# Mastra GTM Agent — Cloudflare Workers wrangler config
# Generated by build: `mastra build` populates .mastra/output/wrangler.jsonc
# This file is the source-of-truth for manual overrides and bindings.

name = "gtm-agent-mastra"
main = ".mastra/output/index.mjs"
compatibility_date = "2026-07-24"
compatibility_flags = ["nodejs_compat"]

# Static assets (custom chat UI built via npm run ui:build)
assets = { directory = ".mastra/output/studio", not_found_handling = "single-page-application" }

# ─── Secrets (set with `wrangler secret put <NAME>`) ───────────────────────
# GEMINI_API_KEY        — Gemini API key (google/gemini-2.5-flash)
# TURSO_DATABASE_URL    — libsql://your-db.turso.io  (or http://localhost:8080 for dev)
# TURSO_AUTH_TOKEN      — Turso auth token (not needed for local dev)

[vars]
# Model config (non-secret)
DIRECTOR_MODEL    = "google/gemini-2.5-flash"
SPECIALIST_MODEL  = "google/gemini-2.5-flash-lite-preview-06-17"

# ─── R2: Asset and replay storage ──────────────────────────────────────────
# Create bucket: wrangler r2 bucket create gtm-agent-assets
[[r2_buckets]]
binding     = "ASSETS_BUCKET"
bucket_name = "gtm-agent-assets"
preview_bucket_name = "gtm-agent-assets-preview"

# ─── Browser Run (Cloudflare Browser Rendering API) ────────────────────────
# GA as of Apr 2026. Free: 10 min/day. Paid: 10 hr/month.
# Docs: https://developers.cloudflare.com/browser-run/
[[browser]]
binding = "BROWSER"

# ─── Durable Objects (Mastra uses these internally via CloudflareDeployer) ─
# These are managed by @mastra/deployer-cloudflare. Do not edit manually.

# ─── Deployment notes ──────────────────────────────────────────────────────
# 1. Build:    cd mastra && npm run build
# 2. Secrets:  npx wrangler secret put GEMINI_API_KEY
#              npx wrangler secret put TURSO_DATABASE_URL
#              npx wrangler secret put TURSO_AUTH_TOKEN
# 3. Deploy:   npx wrangler deploy
