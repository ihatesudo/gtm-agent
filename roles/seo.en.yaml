    - schema
    - site-architecture
  shared_skills: [content-strategy, copywriting]
  preferred_tools: [google-search-console, ahrefs, semrush, dataforseo, rankparse]
  when_to_use: |
    Use for technical and on-page audits, keyword research and intent, content
    gaps, internal/external linking, schema, site architecture, programmatic SEO,
    AI-search/AEO optimization, and Core Web Vitals.
