[project]
name = "marketing-agent"
version = "0.1.0"
description = "AI marketing agent — a commandable growth team with 7 specialists, 47 skill playbooks, and 150+ platform integrations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.10.0",
    "langgraph>=0.4.0",
    "langchain>=0.3.0",
    "langchain-google-genai>=2.1.0",
    "langchain-openai>=1.4.0",
    "langchain-community>=0.3.0",
    "duckduckgo-search>=6.0.0",
    "ddgs>=9.14.4",
    "pyyaml>=6.0",
    "reflex>=0.8.0",
]

[dependency-groups]
dev = [
    "pip>=26.1.2",
    "pytest>=9.1.1",
]
